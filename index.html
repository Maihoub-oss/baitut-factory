<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بيتوت – مصنع التنجيد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f4f3;--panel:#ffffff;--ink:#10367D;--muted:#5d6b85;--line:#e2e7ea;
  --navy:#10367D;--coral:#FF601F;--coral-soft:#ffe9df;--navy-soft:#e7ecf5;--chip:#eef2f4;
  --ok:#2c8a66;--ok-soft:#e3f3ec;--warn:#b7790c;--warn-soft:#fbf0d9;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#060f24;--panel:#0d1c3d;--ink:#eaf2f5;--muted:#9bb0ba;--line:#1f3160;
    --coral-soft:#3b221c;--navy-soft:#162a57;--chip:#162a57;--ok-soft:#0f3328;--warn-soft:#3a2c0e;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#060f24;--panel:#0d1c3d;--ink:#eaf2f5;--muted:#9bb0ba;--line:#1f3160;
  --coral-soft:#3b221c;--navy-soft:#162a57;--chip:#162a57;--ok-soft:#0f3328;--warn-soft:#3a2c0e;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
.login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
.login[hidden]{display:none}
.login-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 24px;box-shadow:0 10px 40px rgba(16,54,125,.08)}
.login-logo{background:var(--navy);border-radius:12px;padding:16px 18px;margin-bottom:18px}
.login-logo svg{display:block;width:100%;height:auto}
.login-card h1{font-size:19px;margin:0 0 4px;color:var(--ink)}
.login-card p{margin:0 0 18px;color:var(--muted);font-size:13.5px}
.login-card label{display:block;font-size:13px;color:var(--muted);margin-bottom:12px}
.login-card input{display:block;width:100%;box-sizing:border-box;margin-top:5px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;direction:ltr;text-align:left}
.login-card input:focus{outline:2px solid var(--coral);outline-offset:0;border-color:transparent}
.login-card button{width:100%;margin-top:6px;padding:12px;border:0;border-radius:10px;background:var(--coral);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.login-card button:disabled{opacity:.6;cursor:wait}
.login-err{color:#c0392b;font-size:13px;min-height:18px;margin-top:10px}
.who{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:rgba(255,255,255,.8);font-size:12.5px}
.who b{color:#fff;font-weight:600}
.logout{background:none;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.85);border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer;margin-inline-start:auto}
.logout:hover{background:rgba(255,255,255,.08)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Readex Pro",Tahoma,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh;min-height:100dvh}
.side{width:236px;flex-shrink:0;background:var(--navy);color:#fff;position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:22px 14px 16px;overflow-y:auto;z-index:20}
.brand{padding:4px 10px 6px}
.brand svg{height:22px;width:auto;display:block}
.side-sub{font-size:12.5px;color:rgba(255,255,255,.6);padding:0 10px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:12px}
.tabs{display:flex;flex-direction:column;gap:2px}
.tabs button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:rgba(255,255,255,.72);padding:11px 12px;border-radius:10px;cursor:pointer;font-weight:500;text-align:start;position:relative}
.tabs button svg{width:19px;height:19px;flex-shrink:0;opacity:.85}
.tabs button:hover{background:rgba(255,255,255,.07);color:#fff}
.tabs button[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff}
.tabs button[aria-current="page"]::before{content:"";position:absolute;inset-inline-start:-14px;top:8px;bottom:8px;width:4px;border-radius:4px;background:var(--coral)}
.tabs button[aria-current="page"] svg{color:var(--coral);opacity:1}
.tabs button:focus-visible{outline:2px solid var(--coral);outline-offset:-2px}
.side-foot{margin-top:auto;font-size:11.5px;color:rgba(255,255,255,.45);padding:14px 10px 0}
.content{flex:1;min-width:0}
.mtop{display:none}
.scrim{display:none}
@media (max-width:860px){
  .side{position:fixed;top:0;bottom:0;inset-inline-start:0;height:auto;transform:translateX(100%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.25);padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15}
  .mtop{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--navy);color:#fff;padding:10px 14px}
  .menu-btn{background:none;border:0;color:#fff;padding:6px;border-radius:8px;cursor:pointer;display:flex}
  .mtitle{font-weight:600;font-size:16px}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
main{max-width:1240px;margin:0 auto;padding:26px 28px 60px}
@media (max-width:860px){main{padding:18px 14px 50px}}
.status{font-size:13px;color:var(--muted);margin-bottom:12px;min-height:1em}
h2{font-size:18px;font-weight:600;margin:0 0 12px}
h3{font-size:15px;font-weight:600;margin:0 0 10px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kpi .lbl{font-size:13px;color:var(--muted)}
.kpi .val{font-size:28px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.hero{background:var(--coral);border-color:var(--coral);color:#fff}
.kpi.hero .lbl,.kpi.hero .sub{color:rgba(255,255,255,.85)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-bottom:16px}
.pipe{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.pipe .st{flex:1 1 110px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;position:relative}
.pipe .st .n{font-size:22px;font-weight:700}
.pipe .st .t{font-size:13px;color:var(--muted)}
.pipe .st.on{border-color:var(--coral)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;color:var(--muted);font-size:12.5px;text-align:start;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--navy-soft)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar .row{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.bar .track{height:8px;background:var(--chip);border-radius:6px;margin-top:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--navy);border-radius:6px}
:root[data-theme="dark"] .bar .fill{background:#8fa9e0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bar .fill{background:#8fa9e0}}
.bar.top .fill{background:var(--coral)}
.seg{display:inline-flex;gap:4px;background:var(--chip);padding:4px;border-radius:12px;margin-bottom:18px}
.seg button{border:0;background:none;padding:8px 22px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button:focus-visible{outline:2px solid var(--coral)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:#c0392b}
.btn.armed,.steps button.armed{background:#c0392b!important;border-color:#c0392b!important;color:#fff!important}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--coral);outline-offset:1px}
.bar-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar-head h2{margin:0}
.bar-head .sp{flex:1}
input.f,select.f,textarea.f{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 10px;width:100%;min-width:0}
input.f.n{text-align:end;font-variant-numeric:tabular-nums;max-width:120px}
td input.f,td select.f{padding:5px 8px}
.chip{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12.5px;background:var(--chip);white-space:nowrap}
.chip.new{background:var(--navy-soft)}
.chip.ready{background:var(--ok-soft);color:var(--ok)}
.chip.delivered{background:var(--chip);color:var(--muted)}
.chip.prog{background:var(--coral-soft);color:var(--coral)}
.chip.cancelled{background:var(--chip);color:var(--muted);text-decoration:line-through}
.chip.late{background:var(--warn-soft);color:var(--warn)}
.missing{color:var(--warn);font-size:12.5px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .btn{margin-top:12px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.form .full{grid-column:1/-1}
.summary{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.summary div{font-size:13px;color:var(--muted)}
.summary b{display:block;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
.summary .big b{color:var(--coral);font-size:23px}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 16px}
.steps button{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:5px 13px;cursor:pointer;font-size:13px}
.steps button.done{background:var(--navy-soft)}
.steps button.cur{background:var(--coral);border-color:var(--coral);color:#fff}
.model{margin-bottom:18px}
.model-head{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:12px;margin-bottom:14px}
@media (max-width:640px){.model-head{grid-template-columns:1fr 1fr}.model-head label:first-child{grid-column:1/-1}}
.model-head label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.model-head input.f.n{max-width:none}
.hint{font-size:13px;color:var(--muted);margin:0 0 14px}
.back{margin-bottom:12px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.shop{margin-bottom:18px}
.svgbox{overflow-x:auto;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px}
.svgbox svg{width:100%;height:auto;min-width:560px;display:block}
.ds{fill:var(--navy-soft);stroke:var(--ink);stroke-width:1.5}
.dd{stroke:var(--ink);stroke-width:1;stroke-dasharray:4 3;fill:none;opacity:.6}
.dm{stroke:var(--coral);stroke-width:1.2;fill:none}
.dl{fill:var(--coral);font-size:13px;font-weight:600}
.dt{fill:var(--muted);font-size:13px}
.lg{fill:var(--ink)}
.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
.photos figure{margin:0}
.photos img{width:100%;border-radius:10px;display:block;border:1px solid var(--line);background:var(--chip)}
.photos figcaption{font-size:12.5px;color:var(--muted);margin-top:4px}
.dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.dims label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.dims input.f.n{max-width:none}
@media print{.svgbox svg{min-width:0}.photos{grid-template-columns:repeat(3,1fr)}}
.sheet{width:794px;height:1123px;background:#fff;color:#10367D;font-family:"Readex Pro",Tahoma,Arial,sans-serif;direction:rtl;position:relative;overflow:hidden;box-sizing:border-box;line-height:1.5}
.sheet *{box-sizing:border-box}
.sh-head{background:#10367D;color:#fff;padding:20px 36px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.sh-head svg{height:24px;width:auto;display:block}
.sh-head .t{font-size:12px;color:#c9d4ea}
.sh-head .n{font-size:24px;font-weight:700;color:#fff}
.sh-body{padding:18px 36px}
.sh-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #d9dfeb;border-radius:10px;overflow:hidden}
.sh-grid>div{padding:9px 12px;border-bottom:1px solid #d9dfeb;border-left:1px solid #d9dfeb;font-size:11px;color:#5d6b85}
.sh-grid b{display:block;font-size:13px;white-space:nowrap;color:#10367D;margin-top:1px;font-weight:600}
.sh-h{font-size:14px;font-weight:600;margin:14px 0 6px;color:#10367D}
.sh-box{border:1.5px solid #FF601F;border-radius:10px;padding:10px 14px;font-size:13.5px;background:#fff6f1;color:#10367D}
.sh-tag{display:inline-block;background:#FF601F;color:#fff;border-radius:6px;padding:3px 12px;font-weight:600;font-size:13px}
.sh-draw{width:100%;height:195px;object-fit:contain;display:block;border:1px solid #d9dfeb;border-radius:10px;background:#fff}
.sh-row{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.sh-photo{width:100%;height:195px;object-fit:cover;display:block;border:1px solid #d9dfeb;border-radius:10px}
.sh-cap{font-size:10.5px;color:#5d6b85;margin-top:4px}
.sh-chk{display:inline-block;width:14px;height:14px;border:1.5px solid #10367D;border-radius:3px;vertical-align:middle}
.sh-pics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sh-pics figure{margin:0}
.sh-pics img{width:100%;height:250px;object-fit:contain;border:1px solid #d9dfeb;border-radius:10px;background:#fafafa;display:block}
.sh-pics figcaption{font-size:11px;color:#5d6b85;margin-top:4px}
.sh-t{width:100%;border-collapse:collapse;font-size:12px}
.sh-t th{background:#eef2f9;color:#5d6b85;font-weight:500;text-align:right;padding:7px 8px}
.sh-t td{padding:4px 8px;border-bottom:1px solid #e6eaf2;color:#10367D}
.sh-t .n{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
.sh-tot{display:flex;gap:28px;margin-top:12px;font-size:11.5px;color:#5d6b85}
.sh-tot b{display:block;font-size:16px;color:#10367D}
.sh-tot .big b{color:#FF601F;font-size:19px}
.sh-sign{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:34px}
.sh-sign div{border-top:1px solid #10367D;padding-top:6px;font-size:12px;text-align:center;color:#10367D}
.sh-foot{position:absolute;bottom:22px;left:36px;right:36px;font-size:10px;color:#8a95ab;display:flex;justify-content:space-between;border-top:1px solid #d9dfeb;padding-top:8px}
.print-only{display:none}
@media print{
  .side,.mtop,.scrim,.tabs,.no-print,.status{display:none!important}
  .print-only{display:block}
  body{background:#fff;color:#000}
  .panel{border:0;padding:0}
  main{padding:0}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* أحجام خط أصغر */
body{font-size:13.5px}
h2{font-size:16px}
h3{font-size:13.5px}
.mtitle{font-size:14.5px}
.summary b{font-size:16px}
.f,select.f,textarea.f,input.f{font-size:13px}
th,td{font-size:13px}
.tabs button{font-size:13.5px}
/* محرر الصور */
.ph-ed{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.ph-ed h4{margin:0 0 8px;font-size:13px;font-weight:600}
.ph-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph-row:last-child{border-bottom:0}
.ph-row img{width:56px;height:42px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.ph-row .ph-none{width:56px;height:42px;border-radius:6px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}
.ph-row .ph-name{flex:1;min-width:120px;font-size:13px}
</style>
</head>

  </div>
  <div class="side-sub">مصنع التنجيد</div>

  <div class="side-foot"><div class="who" id="who" hidden><span>👤 <b id="whoName"></b></span><button class="logout" id="logoutBtn" type="button">خروج</button></div>بيتوت © 2026</div>

  <header class="mtop">

  function drawingSVG(d,side){

  async function imgToData(file,max){max=max||1000;const url=URL.createObjectURL(file);try{const im=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=url});const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.8)}finally{URL.revokeObjectURL(url)}}
